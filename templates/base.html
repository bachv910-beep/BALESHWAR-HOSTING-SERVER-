<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03170b">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
{% block top %}{% endblock %}
{% block body %}{% endblock %}
{% include 'footer.html' %}
</div>
{% block nav %}{% endblock %}
{% if S.whatsapp %}
<a class="wa" href="https://wa.me/{{ S.whatsapp }}" target="_blank" rel="noopener" aria-label="WhatsApp helpline">
<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg>
</a>
{% endif %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block js %}{% endblock %}
</body>
</html>
